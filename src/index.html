    <style>
      .boot-progress {
        position: fixed;
        inset: 0 0 auto;
        height: 4px;
        overflow: hidden;
        z-index: 2000;
        background: rgba(70, 79, 255, 0.1);
        pointer-events: none;
      }
      .boot-progress::after {
        content: '';
        position: absolute;
        width: 38%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #464fff, #22d3ee);
        animation: boot-progress-travel 1.6s ease-in-out infinite;
      }
      @keyframes boot-progress-travel {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(370%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-progress::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <style>
      body {
        margin: 0;
      }
      .boot-shell {
        min-height: 100dvh;
        background: var(--surface-page, #f7f8fa);
        color: var(--text-muted, #64748b);
        font-family: system-ui, sans-serif;
      }
      .boot-nav {
        height: 76px;
        box-sizing: border-box;
        padding: 0 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-subtle, #e2e8f0);
      }
      .boot-nav span,
      .boot-body i {
        display: block;
        background: var(--surface-sunken, #e2e8f0);
        border-radius: 8px;
      }
      .boot-nav span {
        width: 140px;
        height: 28px;
      }
      .boot-nav span:last-child {
        width: 80px;
      }
      .boot-body {
        min-height: calc(100dvh - 76px);
        box-sizing: border-box;
        padding: clamp(56px, 12vh, 150px) clamp(24px, 6vw, 96px);
      }
      .boot-body p {
        font-size: 13px;
        margin: 0 0 28px;
      }
      .boot-body i {
        width: min(460px, 85%);
        height: 40px;
        margin: 16px 0;
      }
      .boot-body i:nth-of-type(2) {
        width: min(340px, 65%);
      }
      .boot-body i:nth-of-type(3) {
        height: 16px;
      }
      .boot-body i:nth-of-type(4) {
        width: 160px;
      }
      @media (prefers-color-scheme: dark) {
        .boot-shell {
          background: var(--surface-page, #07090d);
          color: var(--text-muted, #a4aaba);
        }
        .boot-nav span,
        .boot-body i {
          background: var(--surface-sunken, #202530);
        }
      }
    </style>
