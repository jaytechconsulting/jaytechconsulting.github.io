<label class="checkbox" [class.is-disabled]="disabled()"><span class="checkbox-target"><input type="checkbox" [checked]="checked()" [disabled]="disabled()" [indeterminate]="indeterminate()" [attr.aria-label]="label()" (change)="change($event)"/><span class="checkbox-box" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path [attr.d]="indeterminate() ? 'M5 10h10' : 'm4.5 10 3.5 3.5 7.5-7.5'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>@if(text()){<span class="checkbox-text">{{text()}}</span>}</label>
