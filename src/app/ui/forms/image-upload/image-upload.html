<div class="rounded-xl border border-border-subtle p-4">
  <div class="mb-3 text-sm font-semibold text-text-strong">{{ label() }}</div>
  <div class="flex flex-wrap items-center gap-4">
    <div
      class="grid h-20 shrink-0 place-items-center overflow-hidden border border-dashed border-border-default bg-surface-sunken p-2"
      [class]="circle() ? 'w-20 rounded-full' : 'w-32 rounded-lg'"
    >
      @if (value()) {
        <img [src]="value()" [alt]="label()" class="h-full w-full object-contain" />
      } @else {
        <span class="text-xs text-text-muted">Sin imagen</span>
      }
    </div>
    <div class="min-w-0">
      <div class="flex flex-wrap items-center gap-2">
        <app-button variant="outline" size="sm" (clicked)="picker.click()">
          {{ value() ? 'Cambiar imagen' : 'Subir imagen' }}
        </app-button>
        @if (value()) {
          <app-button variant="ghost" size="sm" (clicked)="upload.cancel(); valueChange.emit('')">Quitar</app-button>
        }
      </div>
      @if (hint()) { <p class="mt-2 text-xs text-text-muted">{{ hint() }}</p> }
    </div>
  </div>
  <input #picker #upload="imageFile" type="file" accept="image/*" hidden appImageFile
    [verifyImage]="true" [imageResetKey]="resetKey()"
    (imageSelected)="valueChange.emit($event)" (imageError)="uploadError.emit($event)" />
</div>
