<div class="strength" [attr.data-level]="level()"><div class="strength-caption"><span>Nivel de contraseña</span><strong aria-live="polite">{{label()}}</strong></div><div class="strength-bars" role="meter" aria-label="Nivel estimado de la contraseña" aria-valuemin="0" aria-valuemax="4" [attr.aria-valuenow]="level()" [attr.aria-valuetext]="label()">@for(bar of [1,2,3,4];track bar){<span [class.filled]="bar<=level()"></span>}</div><ul>@for(check of checks();track check.label){<li [class.valid]="check.valid"><app-icon [name]="check.valid?'check':'minus'"/><span>{{check.label}}</span></li>}</ul></div>
