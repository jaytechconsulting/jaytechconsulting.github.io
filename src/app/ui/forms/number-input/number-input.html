<div class="number-field"><label [for]="id">{{label()}}@if(required()){<span aria-hidden="true"> *</span>}</label><div class="number-control" [class.is-disabled]="disabled()"><input #field type="number" [id]="id" [value]="value()" [placeholder]="placeholder()" [attr.min]="min()" [attr.max]="max()" [step]="step()" [disabled]="disabled()" [required]="required()" (input)="valueChange.emit($any($event.target).value)"/><div class="number-actions"><button type="button" [disabled]="disabled() || atMin()" [attr.aria-label]="'Disminuir ' + label()" (click)="increment(-1)"><app-icon name="minus" /></button><button type="button" [disabled]="disabled() || atMax()" [attr.aria-label]="'Aumentar ' + label()" (click)="increment(1)"><app-icon name="plus" /></button></div></div></div>
