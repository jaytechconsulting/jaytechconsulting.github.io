<article class="fc-card group relative flex h-full flex-col transition-transform duration-200 ease-out hover:-translate-y-1" [style.--fc-accent]="accentColor()">
  <div class="fc-frame relative flex h-full flex-col overflow-hidden rounded-xl border border-border-subtle bg-surface-card shadow-sm">
    <button
      type="button"
      class="relative flex h-[148px] w-full shrink-0 cursor-pointer items-center justify-center overflow-hidden bg-cover bg-center"
      [style.background-image]="image() ? 'url(' + image() + ')' : 'linear-gradient(135deg, ' + accentColor() + '30, ' + accentColor() + '08)'"
      aria-label="Ver detalle completo"
      (click)="imageClick.emit()"
    >
      @if (!image()) {
        <span class="text-4xl opacity-70" [style.color]="accentColor()">{{ glyph() }}</span>
      }
      <div class="pointer-events-none absolute inset-0 bg-[image:var(--texture-grid)] bg-[length:var(--texture-grid-size)] opacity-20"></div>
      <div class="pointer-events-none absolute inset-x-0 bottom-0 h-14 bg-gradient-to-t from-surface-card to-transparent"></div>
      <div class="fc-zoom pointer-events-none absolute inset-0 flex items-center justify-center bg-black/0 opacity-0 transition-all duration-200 ease-out group-hover:bg-black/25 group-hover:opacity-100">
        <span class="flex h-10 w-10 scale-75 items-center justify-center rounded-full bg-white/90 text-base text-ink-950 shadow-lg transition-transform duration-200 ease-out group-hover:scale-100">⤢</span>
      </div>
    </button>

    <div
      class="absolute top-[148px] left-6 flex h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full text-lg font-semibold text-white ring-4 ring-surface-card"
      [style.background]="accentColor()"
    >
      {{ glyph() }}
    </div>

    <div class="flex flex-1 flex-col px-6 pt-7 pb-6">
      @if (badges().length) {
        <div class="mb-2.5 flex flex-wrap items-center gap-2">
          @for (b of badges(); track b) {
            <span class="rounded-pill border border-border-subtle bg-surface-sunken px-2.5 py-1 font-mono text-xs text-text-muted">{{ b }}</span>
          }
        </div>
      }
      <h3 class="m-0 mb-2 line-clamp-2 font-display text-xl font-semibold text-text-strong">{{ title() }}</h3>
      <p class="m-0 line-clamp-3 text-[15px] leading-[1.6] text-text-muted">{{ description() }}</p>

      <div class="mt-5 border-t border-border-subtle pt-4">
        <app-button variant="outline" size="sm" [fullWidth]="true" (clicked)="viewDetails.emit()">
          Ver más detalles
          <span slot="icon-right">→</span>
        </app-button>
      </div>
    </div>
  </div>
</article>
