@if (visible()) {
  <div
    class="relative flex items-center justify-center gap-3 bg-accent-primary px-10 py-2.5 text-center font-body text-[13.5px] font-medium text-text-on-brand"
    [style]="barStyle()"
  >
    <span>{{ announcement().message }}</span>
    @if (announcement().linkHref) {
      <a [href]="announcement().linkHref" class="font-semibold underline underline-offset-2 hover:no-underline">{{ announcement().linkLabel || 'Ver más' }}</a>
    }
    <button
      type="button"
      class="absolute right-3 top-1/2 flex h-6 w-6 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full border-0 bg-transparent text-text-on-brand/70 transition-colors duration-150 ease-out hover:text-text-on-brand"
      aria-label="Cerrar aviso"
      (click)="dismiss()"
    >
      ✕
    </button>
  </div>
}
