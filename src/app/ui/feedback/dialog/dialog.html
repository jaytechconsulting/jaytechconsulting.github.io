@if(open()) {
  <div class="dl-dialog-overlay" [class.is-closing]="closing()" (mousedown)="onBackdrop($event)">
    <section role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId" [attr.aria-describedby]="messageId" class="dl-dialog-panel" [style.--dialog-accent]="toneColor()">
      <header class="dialog-header">
        <img class="dialog-logo" [src]="theme.theme() === 'dark' ? 'brand/animated/logo-animado-oscuro.svg' : 'brand/animated/logo-animado-claro.svg'" alt="Jaytech" width="112" height="36" />
        <app-button variant="ghost" size="sm" icon="close" [iconOnly]="true" label="Cerrar diálogo" [disabled]="closing()" (clicked)="requestClose(false)" />
      </header>
      <div class="dialog-body">
        <div class="dialog-symbol" [attr.data-tone]="tone()" aria-hidden="true"><app-icon [name]="icon()" /></div>
        <span class="dialog-context">{{contextLabel()}}</span>
        <h2 [id]="titleId">{{title()}}</h2>
        <div class="dialog-message" [id]="messageId">{{message()}}<ng-content /></div>
      </div>
      <footer class="dialog-actions" [class.single-action]="!cancelLabel()">
        @if(cancelLabel()){<app-button variant="outline" size="md" [fullWidth]="true" [disabled]="closing()" (clicked)="requestClose(false)">{{cancelLabel()}}</app-button>}
        <app-button [variant]="tone() === 'danger' ? 'danger' : 'primary'" size="md" icon="check" [fullWidth]="true" [disabled]="closing()" (clicked)="requestClose(true)">{{confirmLabel()}}</app-button>
      </footer>
    </section>
  </div>
}
