<div
  [attr.inert]="dialogs.dialog() ? '' : null"
  class="app-content"
  [class.app-content--revealed]="!showLoader()"
  [class.page-fade-in]="pageFade()"
>
  <router-outlet />
</div>
<app-nav-progress-bar
  [visible]="!navigationReady() || showProgressBar() || loading.hasPendingRequests()"
  [color]="loaderColor()"
/>
<app-toast-stack />
<app-dialog-outlet />
@if (version.updateAvailable()) {
  <aside
    class="fixed right-4 bottom-4 z-70 flex max-w-[calc(100%-2rem)] flex-wrap items-center gap-3 rounded-xl border border-border-subtle bg-surface-card p-4 font-body text-sm text-text-strong shadow-lg"
    [attr.inert]="dialogs.dialog() ? '' : null"
    aria-label="Actualización disponible"
  >
    <span role="status">Hay una versión nueva. Guarda tus cambios antes de actualizar.</span>
    <button
      type="button"
      class="rounded-full bg-accent-primary px-4 py-2 font-semibold text-text-on-brand disabled:opacity-50"
      [disabled]="loading.hasPendingRequests()"
      (click)="version.reload()"
    >Actualizar</button>
  </aside>
}
<!-- Visitor state (cart, cookie choice) lives in the browser: never bake it into shared HTML. -->
@if (browser && !inAdmin()) {
  <app-cart-footer />
  <app-cookie-consent />
}

@if (showLoader()) {
  <div class="fixed inset-0 z-[100]">
    <app-loader (completed)="finishLoader()" />
  </div>
}
