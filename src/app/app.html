<div [attr.inert]="dialogs.dialog() ? '' : null" class="app-content" [class.app-content--revealed]="!showLoader()" [class.page-fade-in]="pageFade()">
  <router-outlet />
</div>
<app-nav-progress-bar [visible]="!navigationReady() || showProgressBar() || loading.hasPendingRequests()" [color]="loaderColor()" />
<app-toast-stack />
<app-dialog-outlet />
@if (!inAdmin()) {
  <app-cart-footer />
}

@if (showLoader()) {
  <div class="fixed inset-0 z-[100]">
    <app-loader (completed)="finishLoader()" />
  </div>
}
