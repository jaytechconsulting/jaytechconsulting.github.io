<div [attr.inert]="dialogs.dialog() ? '' : null" class="app-content" [class.app-content--revealed]="!showLoader()">
  <router-outlet />
</div>
@if(!inAdmin()){<app-nav-progress-bar [visible]="showProgressBar() || loading.hasPendingRequests()" [color]="loaderColor()" />}
<app-toast-stack />
<app-dialog-outlet />

@if (showLoader()) {
  <div class="fixed inset-0 z-[100]">
    <app-loader (completed)="finishLoader()" />
  </div>
}
