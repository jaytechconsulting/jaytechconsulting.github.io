<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 80 96" width="350" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Jaytech</title><path class="jl" pathLength="240" d="M8 24 H26 L34 10 L44 38 L52 24 H66 V66 A20 20 0 0 1 26 66" fill="none" stroke="#C6F432" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"></path><circle class="jdot" cx="8" cy="24" r="9" fill="#4058FF"></circle><style>
