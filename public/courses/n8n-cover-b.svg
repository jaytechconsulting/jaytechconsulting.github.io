<svg width="1280" height="720" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0F14"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>
    <filter id="b-glow" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <radialGradient id="b-dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6F432" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C6F432" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#b-bg)"/>

  <!-- faint grid -->
  <g stroke="#1A2030" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
    <line x1="107" y1="0" x2="107" y2="360"/>
    <line x1="214" y1="0" x2="214" y2="360"/>
    <line x1="321" y1="0" x2="321" y2="360"/>
    <line x1="428" y1="0" x2="428" y2="360"/>
    <line x1="535" y1="0" x2="535" y2="360"/>
  </g>

  <!-- trigger threshold -->
  <line x1="0" y1="124" x2="640" y2="124" stroke="#4058FF" stroke-width="1.25" stroke-dasharray="3 7" opacity="0.5"/>

  <!-- pulse glow underlay -->
  <path d="M-10 212 L150 212 L172 212 L186 96 L202 288 L218 180 L236 212 L420 212 L442 212 L456 100 L472 282 L488 180 L506 212 L650 212"
        fill="none" stroke="#C6F432" stroke-width="9" opacity="0.4" filter="url(#b-glow)"/>
  <!-- pulse line -->
  <path d="M-10 212 L150 212 L172 212 L186 96 L202 288 L218 180 L236 212 L420 212 L442 212 L456 100 L472 282 L488 180 L506 212 L650 212"
        fill="none" stroke="#DDFB86" stroke-width="2.25" stroke-linejoin="round"/>

  <!-- trigger markers at spike peaks -->
  <g>
    <circle cx="186" cy="96" r="18" fill="url(#b-dot-glow)"/>
    <circle cx="186" cy="96" r="4.5" fill="#07090D" stroke="#C6F432" stroke-width="2"/>
  </g>
  <g>
    <circle cx="456" cy="100" r="18" fill="url(#b-dot-glow)"/>
    <circle cx="456" cy="100" r="4.5" fill="#07090D" stroke="#C6F432" stroke-width="2"/>
  </g>

  <!-- small action nodes hanging off the triggers, feeding downward into the flat line -->
  <g opacity="0.85">
    <rect x="160" y="300" width="44" height="34" rx="8" fill="#151922" stroke="#4058FF" stroke-width="1.5"/>
    <line x1="186" y1="96" x2="186" y2="300" stroke="#222834" stroke-width="1.25" stroke-dasharray="2 5"/>
  </g>
  <g opacity="0.85">
    <rect x="430" y="300" width="44" height="34" rx="8" fill="#151922" stroke="#4058FF" stroke-width="1.5"/>
    <line x1="456" y1="100" x2="456" y2="300" stroke="#222834" stroke-width="1.25" stroke-dasharray="2 5"/>
  </g>

  <!-- watermark glyph -->
  <path d="M580 40 l26 15 v30 l-26 15 -26-15 v-30 z" fill="none" stroke="#222834" stroke-width="1.5" opacity="0.6"/>
</svg>
