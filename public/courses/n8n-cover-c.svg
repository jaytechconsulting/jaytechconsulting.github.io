<svg width="1280" height="720" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0F14"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>
    <linearGradient id="c-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4058FF"/>
      <stop offset="100%" stop-color="#C6F432"/>
    </linearGradient>
    <filter id="c-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="c-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="#1A2030"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#c-bg)"/>
  <rect width="640" height="360" fill="url(#c-dots)" opacity="0.6"/>

  <!-- back card -->
  <g transform="rotate(-7 250 190)" opacity="0.55">
    <rect x="150" y="120" width="220" height="140" rx="18" fill="#151922" stroke="#222834" stroke-width="1.5"/>
    <circle cx="190" cy="160" r="5" fill="#5B6273"/>
    <circle cx="260" cy="160" r="5" fill="#5B6273"/>
    <path d="M195 160 H255" stroke="#363D4C" stroke-width="2"/>
  </g>

  <!-- middle card -->
  <g transform="rotate(4 330 200)" opacity="0.8">
    <rect x="230" y="150" width="220" height="140" rx="18" fill="#151922" stroke="#363D4C" stroke-width="1.5"/>
    <circle cx="270" cy="190" r="5" fill="#8A9BFF"/>
    <circle cx="340" cy="190" r="5" fill="#8A9BFF"/>
    <circle cx="410" cy="190" r="5" fill="#8A9BFF"/>
    <path d="M275 190 H335 M345 190 H405" stroke="#4058FF" stroke-width="2"/>
  </g>

  <!-- front card -->
  <g filter="url(#c-shadow)">
    <g transform="rotate(-2 380 230)">
      <rect x="280" y="190" width="240" height="150" rx="20" fill="#0C0F14" stroke="url(#c-edge)" stroke-width="2"/>
      <rect x="280" y="190" width="240" height="4" rx="2" fill="url(#c-edge)"/>
      <circle cx="326" cy="236" r="6" fill="#07090D" stroke="#C6F432" stroke-width="2"/>
      <circle cx="404" cy="236" r="6" fill="#07090D" stroke="#C6F432" stroke-width="2"/>
      <circle cx="474" cy="266" r="6" fill="#07090D" stroke="#4058FF" stroke-width="2"/>
      <path d="M332 236 C 360 236, 376 236, 398 236" stroke="#C6F432" stroke-width="2.25" fill="none"/>
      <path d="M410 238 C 430 250, 450 258, 468 264" stroke="#C6F432" stroke-width="2.25" fill="none"/>
      <rect x="300" y="286" width="72" height="14" rx="7" fill="#1A2030"/>
      <rect x="300" y="308" width="110" height="10" rx="5" fill="#151922"/>
    </g>
  </g>

  <!-- watermark glyph -->
  <path d="M580 40 l26 15 v30 l-26 15 -26-15 v-30 z" fill="none" stroke="#222834" stroke-width="1.5" opacity="0.6"/>
</svg>
